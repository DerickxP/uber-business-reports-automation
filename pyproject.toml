[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uber-business-reports-automation"
version = "1.0.0"
description = "Extração automatizada de relatórios do Uber for Business, consolidação em SQLite e dashboard interativo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DerickxP" }]
keywords = ["playwright", "browser-automation", "etl", "sqlite", "dashboard", "uber-for-business"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
uber-reports = "uber_reports.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uber_reports.dashboard" = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
